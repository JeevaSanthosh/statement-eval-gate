# What CI replays and scores on every pull request.
# Change the prompt or model here, re-record locally against Ollama, commit the new cassettes.
[candidate]
prompt = "prompts/extract_v3.md"
provider = "ollama"
model = "qwen3.5:4b"
think = false       # Qwen3.5 thinks by default; off keeps extraction fast on a laptop. Remove for non-thinking models.

[gate]
max_drop = 0.02     # a field can fail only if its F1 drops by more than this
confidence = 0.95   # ...and the paired bootstrap interval for the drop excludes zero
resamples = 10000
