name: eval-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OCR tools
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          PYTHONWARNDEFAULTENCODING: "1"  # any file I/O without an explicit encoding fails (see pyproject.toml)

  gate:
    # Replays the recorded model responses for the candidate in eval.toml, scores
    # them and the baseline from the target branch with this branch's code, and
    # fails if any field's F1 drops significantly. No model runs here.
    if: github.event_name == 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Take the baseline from the target branch, not from this PR
        run: |
          mkdir -p .target-baseline
          if git cat-file -e "origin/${{ github.base_ref }}:results/baseline/predictions.jsonl" 2>/dev/null; then
            git archive "origin/${{ github.base_ref }}" results/baseline | tar -x -C .target-baseline
          fi
      - name: Replay the candidate and compare
        run: seg gate --baseline .target-baseline/results/baseline
