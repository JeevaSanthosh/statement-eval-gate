[project]
name = "statement-eval-gate"
version = "0.1.0"
description = "Per-field evaluation and a release gate for LLM extraction from financial statements"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jeeva Santhosh" }]
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pdf2image>=1.17",
    "pdfplumber>=0.11",
    "pillow>=10",
    "pydantic>=2.6",
    "pytesseract>=0.3.10",
    "reportlab>=4.0",
]

[project.optional-dependencies]
mlflow = ["mlflow>=3"]
dev = ["pytest>=8"]

[project.scripts]
seg = "seg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# With PYTHONWARNDEFAULTENCODING=1 (set in CI), reading or writing a file without an explicit
# encoding fails the tests. Windows defaults to cp1252, which garbles '£' and would stop
# recordings made on Windows from replaying anywhere else.
filterwarnings = ["error::EncodingWarning"]
